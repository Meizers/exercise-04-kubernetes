apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres
type: Opaque
# Dev-only values from .env.example, base64-encoded (echo -n noderegistry | base64).
data:
  POSTGRES_USER: bm9kZXJlZ2lzdHJ5
  POSTGRES_PASSWORD: bm9kZXJlZ2lzdHJ5
  POSTGRES_DB: bm9kZXJlZ2lzdHJ5
